name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests pytest
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Lancer les tests
        run: python -m pytest -q

  docker:
    name: Image Docker
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t application-tp:ci --build-arg APP_VERSION=${{ github.sha }} .

      - name: Démarrer le conteneur
        run: docker run -d --name application-tp-ci -p 8080:8000 application-tp:ci

      - name: Attendre /health (60 s maximum)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "Le service n'a pas répondu dans le délai imparti"
          exit 1

      - name: Vérifier /version
        run: curl -fsS http://localhost:8080/version | grep -q "${{ github.sha }}"

      - name: Afficher les journaux du conteneur
        if: always()
        run: docker logs application-tp-ci
  
  publish:
    name: Publier dans GHCR
    needs: [tests, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Nom de l'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Construire l'image versionnée
        run: |
          docker build \
            --build-arg APP_VERSION="${GITHUB_SHA}" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            -t "${IMAGE}:${GITHUB_SHA}" .

      - name: Tester l'image avant publication
        run: |
          docker run -d --name app-publish -p 8080:8000 "${IMAGE}:${GITHUB_SHA}"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs app-publish
          exit 1

      - name: Se connecter à GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publier l'image
        run: docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Conserver le digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}")
          echo "Image publiée : ${DIGEST}"
          echo "### Image publiée" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit : \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest : \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"